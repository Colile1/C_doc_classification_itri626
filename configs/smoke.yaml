# smoke.yaml — the whole pipeline on 25 images per class, for the laptop.
# Author: Colile Sibanda

extends: base.yaml

name: smoke
seed: 626

# Cleaning reads and hashes every raw image before the cap, so the smoke run
# gets its own small raw set (200 per class), built with
#   python extract_rvl_cdip.py --source <extraction> --per-class 200 --dest data/interim/smoke_raw
paths:
  raw: data/interim/smoke_raw

data:
  n_per_class: 25

image:
  size: 64

train:
  model: baseline_cnn
  epochs: 2
  batch_size: 8
  num_workers: 0
  early_stopping_patience: 2
  pretrained: false

eval:
  batch_size: 8
  latency_repeats: 5
  error_samples: 4
